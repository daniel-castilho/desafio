# Spring Boot properties

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# Datasource (credentials are provided by environment variables loaded from .env)
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/desafio
spring.datasource.username=desafio
spring.datasource.password=desafio

spring.flyway.enabled=true
# O Flyway vai procurar por scripts SQL nesta pasta
spring.flyway.locations=classpath:db/migration

# H2 Console (disabled for main profile)
spring.h2.console.enabled=false

# JWT Configuration
app.jwt.secret=jwtsecret25
app.jwt.issuer=desafio-api
app.jwt.expiration.hours=2

# Docker Compose Integration
# Disable lifecycle management to prevent Spring from trying to start/stop containers.
# This allows us to run the app from the IDE and connect to a manually started DB.
spring.docker.compose.lifecycle-management=none
